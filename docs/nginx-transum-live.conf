# Reverse proxy for the live bus sidecar (SSE). Copy into
# /etc/nginx/sites-available/transum-live, edit the domain, then:
#   ln -s /etc/nginx/sites-available/transum-live /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d live.example.com
#
# The sidecar listens on loopback only. Replace the snake_case placeholders
# below; keep the SSE-specific settings as they are.

upstream transum_live {
    server 127.0.0.1:8787;
    # Reuse upstream connections instead of one TCP connection per stream.
    keepalive 8;
}

server {
    listen 80;
    server_name live.example.com;
    # certbot --nginx rewrites this block to redirect to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name live.example.com;

    ssl_certificate     /etc/letsencrypt/live/live.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.example.com/privkey.pem;

    # No access log for streams: one long connection would be logged only at
    # close, which is unhelpful, and it grows without bound on busy days.
    access_log off;

    location /live/ {
        proxy_pass http://transum_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: never buffer or cache a snapshot, and allow the
        # stream to stay idle between heartbeats (the sidecar sends one every
        # 15 s, so this timeout only fires when the upstream is dead).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Do not add gzip_types text/event-stream: per-event compression
        # delays flushing and defeats streaming.
    }
}
